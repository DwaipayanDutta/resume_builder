[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-builder"
version = "0.3.0"
description = "Tailor a CV with any LLM (100+ providers via LiteLLM) and build a 2-page Resume.docx and Resume.pdf"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["python-docx", "reportlab", "pypdf"]

[project.optional-dependencies]
ai = ["litellm>=1.0.0"]

[project.scripts]
create-resume = "resume_builder.create_resume:main"
tailor-resume = "resume_builder.tailor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resume_builder = ["prompt_template.txt"]
