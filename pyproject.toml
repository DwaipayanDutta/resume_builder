[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-builder"
version = "0.2.0"
description = "Tailor a CV with local Qwen or the Claude API and build a 2-page Resume.docx and Resume.pdf"
requires-python = ">=3.9"
dependencies = ["python-docx", "reportlab", "pypdf"]

[project.scripts]
create-resume = "resume_builder.create_resume:main"
tailor-resume = "resume_builder.tailor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resume_builder = ["prompt_template.txt"]
