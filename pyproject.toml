[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-builder"
version = "0.3.0"
description = "Tailor a CV with any LLM (100+ providers via LiteLLM) and build a 2-page Resume.docx and Resume.pdf"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["python-docx", "reportlab", "pypdf"]

[project.optional-dependencies]
ai = ["litellm>=1.0.0"]
claude = ["anthropic>=0.30.0"]
postgres = ["psycopg[binary]>=3.1"]
web = [
    "pydantic>=2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "jinja2>=3.1.0",
    "httpx>=0.24.0",
    "mammoth>=1.8.0",
    "weasyprint>=60.0",
    "python-multipart>=0.0.9",
]
all = [
    "litellm>=1.0.0",
    "anthropic>=0.30.0",
    "pydantic>=2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "jinja2>=3.1.0",
    "httpx>=0.24.0",
    "mammoth>=1.8.0",
    "weasyprint>=60.0",
    "python-multipart>=0.0.9",
]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
create-resume = "resume_builder.create_resume:main"
tailor-resume = "resume_builder.tailor:main"
resume-studio = "resume_builder.webapp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resume_builder = ["prompt_template.txt", "rendering/templates/*.html"]
